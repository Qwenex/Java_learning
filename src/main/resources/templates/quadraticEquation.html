<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Калькулятор КУ</title>
<style>
    body {
        font-family: Arial;
        line-height: 1.6;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background: url("https://blogs.haas.berkeley.edu/hubfs/blog/kim%20-%20stock%20photo%20folder/AdobeStock_67262955%20%5BConverted%5D.png")
          center no-repeat  fixed;
          background-size: cover;
    }

    .header {
        text-align: center;
        background: white;
        border-radius: 10px;
    }

    #equationForm {
        background: white;
        padding: 30px;
        border-radius: 10px;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 2px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        background: #3498db;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #2980b9;
    }

    #result {
        margin: 20px 0;
    }

    #result div {
        background: #e8f4f8;
        padding: 15px;
        border-radius: 6px;
        border-left: 4px solid #3498db;
    }

    /* История решений */
    #history {
        background: white;
        padding: 25px;
        border-radius: 10px;
    }

    #history h3 {
        color: #2c3e50;
        margin-bottom: 20px;
        text-align: center;
    }

    #historyTable {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    #historyTable th {
        background-color: #f8f9fa;
        padding: 12px 15px;
        text-align: left;
        font-weight: bold;
        color: #2c3e50;
    }

    #historyBody td {
        color: #333;
        font-style: normal;
    }

    .error {
        background: #f8d7da !important;
        color: #721c24;
        border-left-color: #dc3545 !important;
    }
</style>
</head>

<body>
<!-- Шапка-->
<div class="header">
<h1>Калькулятор квадратных уравнений</h1>
<p class="subtitle">Введите коэффициенты уравнения: ax² + bx + c = 0</p>
</div>

<!-- Форма для отправки коэффицентов уравнения -->
<form id="equationForm">
<div>
    <label for="a">Коэффициент a:</label>
    <input type="number" id="a" name="a" step="any" required>
</div>
<div>
    <label for="b">Коэффициент b:</label>
    <input type="number" id="b" name="b" step="any" required>
</div>
<div>
    <label for="c">Коэффициент c:</label>
    <input type="number" id="c" name="c" step="any" required>
</div>
<div>
    <button type="submit">Решить уравнение</button>
</div>
</form>

<!-- Результат -->
<div id="result"></div>

<!-- История решений -->
<div id="history">
<h3>История решений (последние 10):</h3>
<table id="historyTable">
    <thead>
    <tr>
        <th>Уравнение</th>
        <th>Ответ</th>
        <th>Дата и время</th>
    </tr>
    </thead>
    <tbody id="historyBody">
    <tr>
        <td>
            История пока пуста...
        </td>
    </tr>
    </tbody>
</table>
</div>
</body>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const equationForm = document.getElementById('equationForm');
    const result = document.getElementById('result');

    // История запросов
    function loadHistory() {
        fetch('/history')
        .then(response => response.json())
        .then(historyData => {
            const historyBody = document.getElementById('historyBody');
                if (historyData.length === 0) {
                    historyBody.innerHTML ='<tr><td>История пока пуста...</td></tr>';
                return;
                }
                historyBody.innerHTML = historyData.map(item =>
                    `<tr>
                        <td>${item.equation}</td>
                        <td>${item.answer}</td>
                        <td>${item.date}</td>
                    </tr>`).join('');
        })
        .catch(error => {
            console.error('Ошибка загрузки истории:', error);
            result.innerHTML = '<div class="error">Ошибка со стороны сервера</div>';
        });
    }
    loadHistory();

    equationForm.addEventListener('submit', function(event) {

        // Не перезагружает страницу после выполнения
        event.preventDefault();

        //Преоброзование коэф-ов и создание объекта для отправки
        const a = parseFloat(document.getElementById('a').value);
        const b = parseFloat(document.getElementById('b').value);
        const c = parseFloat(document.getElementById('c').value);

        const equationData = {
            a: a,
            b: b,
            c: c
        }

        // Подготовка формата уравнения
        function formatEquation(a, b, c) {
        return `Уравнение: ${a}x² ${b >= 0 ? '+' : ''}${b}x ${c >= 0 ? '+' : ''}${c} = 0`;
        }

        // Отправка запроса и получение ответа
        result.innerHTML = '<div>Решаем уравнение...</div>';
        const equationString = formatEquation(a, b, c);

        fetch('/solve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(equationData)
        })
        .then(response => response.json())
        .then(data => {
            function formatRoots(x1, x2) {
                if (x1 === null && x2 === null) {
                    return 'Уравнение не имеет действительных корней';
                }
                if (x2 === null) {
                    return `Один корень: x = ${x1.toFixed(2)}`;
                }
                return `x₁ = ${x1.toFixed(2)} | x₂ = ${x2.toFixed(2)}`;
            }
            result.innerHTML =
               `<div class="result-box">
                     <strong>${equationString}</strong><br><br>
                     <strong>Ответ:</strong> ${formatRoots(data.x1, data.x2)}
               </div>`;
            loadHistory();
        })
        .catch(error => {
            console.error('Ошибка при расчете уравнения:', error);
            result.innerHTML = '<div class="error">Ошибка со стороны сервера</div>';
        });
    });
});
</script>
</html>
