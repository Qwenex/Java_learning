services:
  app:
    image: app
    container_name: quadraticEquation-App
    ports:
      - "8080:8080"
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: postgres:17
    container_name: TodoList-Postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=quadraticEquationDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ='GMT+3'
      - PGTZ='GMT+3'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always

volumes:
  postgres_data:

networks:
  app-network: {}